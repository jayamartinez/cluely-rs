# cargo-about configuration for the THIRD_PARTY_LICENSES file.
# Run via dev/third-party-licenses.ps1.

targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CDLA-Permissive-2.0",
]
