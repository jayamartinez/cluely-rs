[package]
name = "cluely-rs"
version = "0.1.0"
edition = "2024"
description = "A native, keyboard-driven assistant overlay for Windows built on GPUI"
publish = false

[dependencies]
anyhow = "1"
audioadapter-buffers = "5.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dirs = "6"
# Reads the deflated document part of DOCX files added to a mode.
flate2 = "1"
futures = "0.3"
global-hotkey = "0.8"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Text of PDF files added to a mode.
pdf-extract = "0.12"
raw-window-handle = "0.6"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ureq = "3"
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
# API keys in the Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# API keys in the login Keychain.
keyring = { version = "3", features = ["apple-native"] }
# The overlay's NSWindow: level, click-through, focus, capture exclusion and resizing.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Desktop audio ("Them"): ScreenCaptureKit's system audio, delivered as Core Media sample buffers.
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-screen-capture-kit = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# parakeet_bench measures process CPU time and resident memory.
libc = "0.2"

[build-dependencies]
cc = "1"
cmake = "0.1"

# Dependencies are optimized even in debug builds: image resizing/JPEG encoding, resampling and
# the HTTP/TLS stack run on every request, and unoptimized they cost over a second per Assist.
# Only this crate's own code stays unoptimized, so rebuilds while developing remain quick.
[profile.dev.package."*"]
opt-level = 3
