[package]
name = "cluely-rs"
version = "0.1.0"
edition = "2024"
description = "A native, keyboard-driven assistant overlay for Windows built on GPUI"
publish = false

[dependencies]
anyhow = "1"
audioadapter-buffers = "5.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dirs = "6"
futures = "0.3"
global-hotkey = "0.8"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3", features = ["windows-native"] }
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9"
