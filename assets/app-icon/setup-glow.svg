<!-- Setup's window background (Paper "Redesign v3 · Onboarding"): a blue glow from the top edge,
     an ellipse 70% wide and 55% tall, fading into the window colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" preserveAspectRatio="none">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7" gradientTransform="translate(0.5 0) scale(1 0.7857) translate(-0.5 0)">
      <stop offset="0" stop-color="#13203A"/>
      <stop offset="1" stop-color="#0F1012"/>
    </radialGradient>
  </defs>
  <rect width="760" height="560" fill="url(#glow)"/>
</svg>
