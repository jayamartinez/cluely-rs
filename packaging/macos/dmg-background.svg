<!-- Background of the CluelyRS DMG window, in Finder points (640 x 400, the window_rect size in
     dmg_settings.py). Light, so Finder's dark icon labels stay readable. The arrow runs between the
     two 128 pt icon slots centred at (160, 176) and (480, 176) (icon_locations in dmg_settings.py);
     move both together. Nothing below y = 360: the title bar takes ~28 pt of the window's height.

     Regenerate dmg-background.tiff (checked in, so building doesn't need librsvg) after editing:
       rsvg-convert -w 640  -h 400 dmg-background.svg -o /tmp/bg.png
       rsvg-convert -w 1280 -h 800 dmg-background.svg -o /tmp/bg@2x.png
       tiffutil -cathidpicheck /tmp/bg.png /tmp/bg@2x.png -out dmg-background.tiff -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <!-- A faint cool tint at the top (the setup window's blue glow, for a light window); a plain
         linear ramp, since a soft radial glow this light bands visibly in 8-bit. -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3FC"/>
      <stop offset="1" stop-color="#F3F4F7"/>
    </linearGradient>
    <linearGradient id="arrow" x1="252" y1="0" x2="388" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#base)"/>

  <!-- Arrow from the app slot to the Applications slot: a shallow arc with an open chevron head. -->
  <g fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 180 Q320 154 384 176"/>
  </g>
  <path d="M371 165 L386 176.5 L369 184" fill="none" stroke="#4C8DFF" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="320" y="318" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="0.2" fill="#6E747D">Drag CluelyRS to Applications to install</text>
</svg>
